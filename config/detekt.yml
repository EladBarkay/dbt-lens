# Extends detekt's defaults. Existing findings are recorded in detekt-baseline.xml;
# new code must not add any. Regenerate the baseline only when removing findings.
complexity:
  CyclomaticComplexMethod:
    threshold: 25
  LongMethod:
    threshold: 100
  NestedBlockDepth:
    threshold: 6
  ComplexCondition:
    threshold: 6
style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  WildcardImport:
    active: false
  MaxLineLength:
    active: false
