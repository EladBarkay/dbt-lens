name: Feature request
description: Suggest an improvement to DBT Lens.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the dbt workflow and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
  - type: textarea
    id: example
    attributes:
      label: Example
      description: A model, macro or YAML snippet showing where the feature would apply.
      render: sql
