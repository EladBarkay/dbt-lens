name: Plugin checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: plugin-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sql
            platform: IU
            version: '2025.3.3'
            java: '21'
            sql: true
            textmate: true
            yaml: true
            free: false
          - name: textmate
            platform: IU
            version: '2025.3.3'
            java: '21'
            sql: false
            textmate: true
            yaml: true
            free: false
          - name: minimal
            platform: IU
            version: '2025.3.3'
            java: '21'
            sql: false
            textmate: false
            yaml: false
            free: true
          - name: pycharm-free
            platform: PY
            version: '2026.2.3'
            java: '25'
            sql: false
            textmate: true
            yaml: true
            free: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          java-version: ${{ matrix.java }}
      - name: Test, format and package
        run: >-
          ./gradlew check verifyPluginProjectConfiguration verifyPluginStructure buildPlugin
          -PplatformType=${{ matrix.platform }} -PplatformVersion=${{ matrix.version }}
          -PwithSqlTests=${{ matrix.sql }} -PwithTextmateTests=${{ matrix.textmate }}
          -PwithYamlTests=${{ matrix.yaml }} -PfreeEditionTests=${{ matrix.free }}
          -PskipSearchableOptions=${{ matrix.name != 'sql' }}
          --console=plain
      - name: Package checksum
        if: matrix.name == 'sql'
        working-directory: build/distributions
        run: sha256sum *.zip > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.name == 'sql'
        with:
          name: plugin-package
          path: build/distributions/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: tests-${{ matrix.name }}
          path: build/reports/tests/
          retention-days: 14
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          java-version: '25'
          extra-java-version: '21'
      - name: Verify supported IDE binaries
        run: >-
          ./gradlew verifyPlugin -PverifySupportedIdes=true -PskipSearchableOptions=true
          -Porg.gradle.java.installations.paths="${{ steps.setup.outputs.java-installations }}"
          --console=plain
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: plugin-verifier
          path: build/reports/pluginVerifier/
          retention-days: 14
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit hooks
        env:
          SKIP: ktfmt
        run: |
          pip install pre-commit==4.7.0
          pre-commit run --all-files --show-diff-on-failure
