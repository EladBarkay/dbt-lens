name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sql: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test verifyPluginProjectConfiguration verifyPluginStructure buildPlugin -PwithSqlTests=${{ matrix.sql }} --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-sql-${{ matrix.sql }}
          path: |
            build/reports/tests/
            build/distributions/
