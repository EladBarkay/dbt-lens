name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - sql: false
            textmate: true
          - sql: true
            textmate: true
          - sql: false
            textmate: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test verifyPluginProjectConfiguration verifyPluginStructure buildPlugin -PwithSqlTests=${{ matrix.sql }} -PwithTextmateTests=${{ matrix.textmate }} --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-sql-${{ matrix.sql }}-textmate-${{ matrix.textmate }}
          path: |
            build/reports/tests/
            build/distributions/
