# JetBrains Qodana: the IDE's own inspections, run in CI. Not a required check yet.
version: "1.0"
linter: jetbrains/qodana-jvm-community:2026.2
projectJDK: "21"
profile:
  name: qodana.recommended
exclude:
  - name: All
    paths:
      - src/main/resources/schemas
properties:
  # Work around an empty ExternalSystemPartialResolutionException in 2026.2 Gradle sync
  # (IDEA-394218 / KTIJ-40132).
  gradle.use.resilient.model.fetch: "false"
